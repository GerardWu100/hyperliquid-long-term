# Run the published image without cloning the repository. This file is all
# the server needs besides the .env file below; save it as docker-compose.yml
# in an empty folder.
#
# Start:   docker compose up -d
# Update:  docker compose pull && docker compose up -d
#
# Before the first start, create the .env file with your ClickHouse settings
# (the README "Install" section has the two commands). The collector only
# reads it; the image never contains it. After editing it, run
# `docker compose up -d --force-recreate` so the change takes effect.
#
# `docker-compose.yml` in the repository is the same service built from a
# local checkout instead of pulled.
services:
  hyperliquid-candles:
    # `latest` follows master. To pin, use a release instead: `1` (every 1.x
    # release), `1.0` (fixes only), or `1.0.0` (exactly that release), or a
    # single commit with `sha-<first 7 characters of the commit>`.
    image: ghcr.io/gerardwu100/hyperliquid-long-term:latest
    container_name: hyperliquid-candles
    # No ports: the collector only makes outgoing requests to Hyperliquid and
    # ClickHouse, so nothing needs to reach it.
    restart: unless-stopped
    environment:
      # Your time zone. Candles, log lines, and log file names stay in UTC
      # whatever this says; it only sets the clock for a shell inside the
      # container.
      - TZ=America/Toronto
    volumes:
      # Folder on your machine, then the path inside the container. Edit the
      # left side to keep files somewhere else; keep the right side as it is.
      # Logs, plus an optional config.toml whose keys override the built-in
      # one. Put only the keys you change (for example the schedule, symbols,
      # or alert thresholds); a misspelled key stops startup with an error:
      - $HOME/.containers/hyperliquid-long-term:/data
      # ClickHouse host, port, user, password, and database, plus the
      # optional Apprise alert URL. Read-only; create this file first, or
      # Docker makes an empty folder in its place and the collector stops
      # with an error:
      - $HOME/.containers/hyperliquid-long-term/.env:/app/.env:ro
    networks:
      - single

networks:
  # Shared network where the collector reaches ClickHouse and Apprise by
  # container name. ClickHouse must be on it too, and IVYDB_CLICKHOUSE_HOST in
  # .env must be the ClickHouse container name with its internal port (8123),
  # not localhost or a host-published port. Compose joins the network if it
  # exists and creates it if it does not.
  single:
    name: single
