services:
  hyperliquid-candles:
    build: .
    container_name: hyperliquid-candles
    restart: unless-stopped
    # Logs (and optional config.toml overrides) live under
    # ~/.containers/hyperliquid-candles, mounted as /data. ClickHouse secrets
    # always come from the repo-root .env, bind-mounted into the image below.
    environment:
      - HL_DATA_DIR=/data
    volumes:
      - $HOME/.containers/hyperliquid-candles:/data
      - ./.env:/app/.env:ro
    # ClickHouse runs on the shared external Docker network "single". This
    # service joins that network and reaches ClickHouse by its service/container
    # name over the internal HTTP port. Set in the repo-root .env:
    #   IVYDB_CLICKHOUSE_HOST = the ClickHouse container/service name on "single"
    #   IVYDB_CLICKHOUSE_PORT = the internal HTTP port (8123 by default), not the
    #                           host-published port, because containers talk
    #                           directly over the shared network.
    networks:
      - single

networks:
  single:
    external: true
