services:
  hyperliquid-candles:
    build: .
    container_name: hyperliquid-candles
    restart: unless-stopped
    # All host files for this service live together under
    # ~/.containers/hyperliquid-candles/ on the host machine: secrets (.env),
    # tunables (config.toml), and the writable log directory. .env and
    # config.toml are mounted read-only because the service never writes them.
    volumes:
      - $HOME/.containers/hyperliquid-candles/.env:/app/.env:ro
      - $HOME/.containers/hyperliquid-candles/config.toml:/app/config.toml:ro
      - $HOME/.containers/hyperliquid-candles/logs:/app/logs
    # ClickHouse runs on the shared external Docker network "single". This
    # service joins that network and reaches ClickHouse by its service/container
    # name over the internal HTTP port. Set in .env:
    #   IVYDB_CLICKHOUSE_HOST = the ClickHouse container/service name on "single"
    #   IVYDB_CLICKHOUSE_PORT = the internal HTTP port (8123 by default), not the
    #                           host-published port, because containers talk
    #                           directly over the shared network.
    networks:
      - single

networks:
  single:
    external: true
