[project]
name = "hyperliquid-long-term"
version = "0.1.0"
description = "Hyperliquid 1-minute perpetual candle ingestion into ClickHouse."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clickhouse-connect>=1.3.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.18",
    "tenacity>=9.1.4",
]

[project.scripts]
hyperliquid-candles = "hyperliquid_candles.app:main"
hyperliquid-candles-run-once = "hyperliquid_candles.scripts_run_once:main"
hyperliquid-candles-quality = "hyperliquid_candles.quality.checks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperliquid_candles"]

[tool.pytest.ini_options]
pythonpath = ["src"]
